# On every pull request, checks for script errors, missing recordings and broken links.
# The checks are in .github/scripts/check-site.js.
name: Basic checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check scripts, recordings and links
        run: node .github/scripts/check-site.js
