# On every pull request, plays the app in a real browser at phone and tablet sizes.
# The tests are in tests/ (see "Tests" in README.md). GitHub's test machines already have Chrome and Python.
name: Browser tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install the test tools
        run: npm ci

      - name: Play the app
        run: npm test

      # A failed test's screenshot and trace, downloadable from the run's page for a week
      - name: Save what the failed tests saw
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          retention-days: 7
